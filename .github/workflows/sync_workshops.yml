name: Sync Workshops

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 * * * *"   # hourly at :15 (UTC)

permissions:
  contents: write

concurrency:
  group: workshop-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      RESOURCES_JSON_PATH: "resources.json"
      SOURCES_JSON_PATH: "config/workshop_sources.json"
      DEFAULT_TZ: "America/Los_Angeles"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil

      - name: Run sync
        run: |
          python scripts/sync_workshops.py \
            --resources "$RESOURCES_JSON_PATH" \
            --sources "$SOURCES_JSON_PATH" \
            --default-tz "$DEFAULT_TZ"

      - name: Quality Check - Run Diagnostics
        run: |
          echo "========================================"
          echo "🔍 RUNNING WORKSHOP QUALITY DIAGNOSTICS"
          echo "========================================"
          python scripts/diagnose_workshops.py resources.json || true
          echo ""
          echo "========================================"
        continue-on-error: true

      - name: Quick Stats
        run: |
          echo "📊 Quick Workshop Stats:"
          echo "  Total workshops: $(jq '.workshops | length' resources.json)"
          echo "  By provider:"
          jq -r '.workshops | group_by(.provider) | map("    \(.[0].provider): \(length) events") | .[]' resources.json | sort
          echo ""
          echo "  Events with generic titles:"
          jq '[.workshops[] | select(.title | test("^(THE VO PROS|Workshop|Class|Event)$"; "i"))] | length' resources.json
          echo ""
        continue-on-error: true

      - name: Commit changes safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "votracker-bot"
          git config user.email "actions@github.com"

          # Preserve the freshly scraped output before resetting to the newest main.
          # On each push attempt we merge only workshops + lastUpdated into the
          # newest resources.json, preserving manual edits to sections/sponsors/etc.
          cp "$RESOURCES_JSON_PATH" /tmp/generated-resources.json

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          import os

          resources_path = os.environ["RESOURCES_JSON_PATH"]
          generated_path = "/tmp/generated-resources.json"

          with open(generated_path, "r", encoding="utf-8") as f:
              generated = json.load(f)

          with open(resources_path, "r", encoding="utf-8") as f:
              current = json.load(f)

          current["workshops"] = generated.get("workshops", [])
          current["lastUpdated"] = generated.get("lastUpdated")

          with open(resources_path, "w", encoding="utf-8") as f:
              json.dump(current, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

            git add "$RESOURCES_JSON_PATH"

            if git diff --cached --quiet; then
              echo "No workshop changes to commit."
              exit 0
            fi

            git commit -m "Sync workshops"

            if git push origin HEAD:main; then
              echo "Workshop sync pushed successfully."
              exit 0
            fi

            echo "Push was rejected because main changed again. Retrying..."
            sleep 2
          done

          echo "Failed to push workshop sync after 3 attempts."
          exit 1
